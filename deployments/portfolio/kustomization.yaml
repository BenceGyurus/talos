apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portfolio # A podinfo helyett nevezzük el portfolio-nak!
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 3m
  wait: true
  prune: true
  path: ./deployments/portfolio # 👈 PONTOSAN erre a mappára mutasson!
  sourceRef:
    kind: GitRepository
    name: talos-repo # 👈 A fenti GitRepository nevére mutat