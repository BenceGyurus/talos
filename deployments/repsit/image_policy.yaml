apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: repsit-image
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: repsit-image
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=1.0.0'