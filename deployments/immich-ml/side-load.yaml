apiVersion: v1
kind: Pod
metadata:
  name: immich-sideload-fix
spec:
  restartPolicy: Never
  containers:
  - name: fixer
    image: python:3.11-slim
    command: ["/bin/bash", "-c"]
    args:
      - |
        # 1. Eszközök telepítése (wget és unzip kell a GitHub letöltéshez)
        apt-get update && apt-get install -y wget unzip
        pip install huggingface_hub

        # 2. Python script indítása
        python3 -c '
        import os
        import shutil
        import subprocess
        from huggingface_hub import snapshot_download

        cache_dir = "/cache"
        clip_target = os.path.join(cache_dir, "clip", "ViT-B-32__openai")
        face_target_base = os.path.join(cache_dir, "facial-recognition", "buffalo_l")
        
        # --- TAKARÍTÁS ---
        print(f"--- 1. Tiszta lap: {clip_target} és {face_target_base} törlése ---")
        if os.path.exists(clip_target): shutil.rmtree(clip_target)
        if os.path.exists(face_target_base): shutil.rmtree(face_target_base)
        
        os.makedirs(os.path.join(clip_target, "textual"), exist_ok=True)
        os.makedirs(os.path.join(clip_target, "visual"), exist_ok=True)
        
        # A face mappán belül almappák kellenek
        os.makedirs(os.path.join(face_target_base, "detection"), exist_ok=True)
        os.makedirs(os.path.join(face_target_base, "recognition"), exist_ok=True)

        # --- FACE MODEL (GITHUB DIRECT) ---
        print("--- 2. Face Model (Buffalo_L) letöltése GitHub-ról ---")
        zip_url = "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip"
        zip_path = "/tmp/buffalo_l.zip"
        unzip_dir = "/tmp/buffalo_l_extracted"
        
        # Letöltés wget-tel
        subprocess.run(["wget", "-O", zip_path, zip_url], check=True)
        
        # Kicsomagolás
        if os.path.exists(unzip_dir): shutil.rmtree(unzip_dir)
        subprocess.run(["unzip", zip_path, "-d", unzip_dir], check=True)

        # Fájlok átnevezése és mozgatása az Immich formátumra
        # det_10g.onnx -> detection/model.onnx
        # w600k_r50.onnx -> recognition/model.onnx
        
        src_det = os.path.join(unzip_dir, "buffalo_l", "det_10g.onnx")
        src_rec = os.path.join(unzip_dir, "buffalo_l", "w600k_r50.onnx")
        
        # Ha nincs buffalo_l almappa a zipben, próbáljuk közvetlenül
        if not os.path.exists(src_det):
            src_det = os.path.join(unzip_dir, "det_10g.onnx")
            src_rec = os.path.join(unzip_dir, "w600k_r50.onnx")

        if os.path.exists(src_det) and os.path.exists(src_rec):
            shutil.move(src_det, os.path.join(face_target_base, "detection", "model.onnx"))
            shutil.move(src_rec, os.path.join(face_target_base, "recognition", "model.onnx"))
            print("✅ Face modellek (detection & recognition) a helyükön.")
        else:
            print("❌ HIBA: Nem találhatók a det_10g.onnx vagy w600k_r50.onnx fájlok a ZIP-ben.")
            print(os.listdir(unzip_dir))

        # --- CLIP MODEL (HUGGING FACE) ---
        print("--- 3. CLIP Model (Xenova) letöltése ---")
        tmp_clip = "/tmp/xenova_clip"
        if os.path.exists(tmp_clip): shutil.rmtree(tmp_clip)
        
        try:
            snapshot_download(repo_id="Xenova/clip-vit-base-patch32", local_dir=tmp_clip, local_dir_use_symlinks=False, allow_patterns=["*.json", "*.onnx", "*.txt"])
            print("✅ CLIP nyers fájlok letöltve.")
            
            # Config fájlok mozgatása
            for f in os.listdir(tmp_clip):
                if f.endswith(".json") or f.endswith(".txt"):
                    shutil.move(os.path.join(tmp_clip, f), clip_target)

            # ONNX fájlok keresése és mozgatása
            for root, dirs, files in os.walk(tmp_clip):
                for file in files:
                    src = os.path.join(root, file)
                    if "text" in file and file.endswith(".onnx"):
                        shutil.move(src, os.path.join(clip_target, "textual", "model.onnx"))
                    elif "vision" in file and file.endswith(".onnx"):
                        shutil.move(src, os.path.join(clip_target, "visual", "model.onnx"))
            
            print("✅ CLIP fájlok a helyükön.")

        except Exception as e:
            print(f"❌ Hiba a CLIP letöltésnél: {e}")

        print("--- KÉSZ. Várakozás... ---")
        '
        sleep 3600
    volumeMounts:
    - name: model-cache
      mountPath: /cache
  volumes:
  - name: model-cache
    persistentVolumeClaim:
      claimName: immich-ml-cache
